[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cronscope"
version = "1.0.0"
description = "See inside your crontab — predict runs, catch the mistakes that cause incidents, and render the week as a heatmap."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohamed Mohsen" }]
keywords = ["cron", "crontab", "devops", "scheduler", "lint", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
cronscope = "cronscope.cli:main"

[project.urls]
Homepage = "https://github.com/RootX22/cronscope"
Issues = "https://github.com/RootX22/cronscope/issues"

[tool.setuptools.packages.find]
include = ["cronscope*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
